name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLOW_REAL_PATIENT_DATA: "false"
  LLM_PROVIDER: disabled
  LLM_MODEL: disabled
  EMBEDDING_MODEL: disabled
  LLM_API_KEY: ""

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Check backend linting
        run: ruff check .

      - name: Check backend formatting
        run: ruff format --check .

      - name: Check backend types
        run: mypy

      - name: Run backend tests without infrastructure
        run: pytest -m "not integration"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend linting
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format

      - name: Check frontend types
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test
