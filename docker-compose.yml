name: clinical-trial-matcher

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trial_matcher}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Temporary scaffold; replace with an API Dockerfile when apps/api exists.
    image: python:3.12-slim
    working_dir: /app
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/trial_matcher}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CLINICAL_TRIALS_API_BASE_URL: ${CLINICAL_TRIALS_API_BASE_URL:-https://clinicaltrials.gov/api/v2}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-replace-with-an-explicit-version}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-replace-with-an-explicit-version}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ALLOW_REAL_PATIENT_DATA: ${ALLOW_REAL_PATIENT_DATA:-false}
      ALLOW_PRODUCTION_LIKE_ENVIRONMENT: ${ALLOW_PRODUCTION_LIKE_ENVIRONMENT:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "echo 'API scaffold: application not implemented yet.'; tail -f /dev/null"]

  worker:
    # Temporary scaffold; replace with a worker image and command when workers exist.
    image: python:3.12-slim
    working_dir: /app
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/trial_matcher}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CLINICAL_TRIALS_API_BASE_URL: ${CLINICAL_TRIALS_API_BASE_URL:-https://clinicaltrials.gov/api/v2}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-replace-with-an-explicit-version}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-replace-with-an-explicit-version}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ALLOW_REAL_PATIENT_DATA: ${ALLOW_REAL_PATIENT_DATA:-false}
    volumes:
      - ./workers:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "echo 'Worker scaffold: job processing not implemented yet.'; tail -f /dev/null"]

  web:
    # Temporary scaffold; replace with the React/Vite development command when apps/web exists.
    image: node:22-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
    depends_on:
      api:
        condition: service_started
    command: ["sh", "-c", "echo 'Web scaffold: application not implemented yet.'; tail -f /dev/null"]

volumes:
  postgres_data:
  redis_data:
